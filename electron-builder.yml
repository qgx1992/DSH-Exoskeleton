appId: io.dsh.exoskeleton
productName: DSH-Exoskeleton
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - '!**/*.map'
extraResources:
  - from: resources/tray.png
    to: tray.png
asar: true
npmRebuild: false
win:
  executableName: DSH-Exoskeleton
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH-Exoskeleton
  artifactName: DSH-Exoskeleton-Setup-${version}.${ext}
portable:
  artifactName: DSH-Exoskeleton-Portable-${version}.${ext}